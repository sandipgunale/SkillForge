name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillforge-backend/skillforge-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (tests + failsafe ITs + JaCoCo gate)
        run: mvn -q verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillforge-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: skillforge-frontend/package-lock.json
      - run: npm ci
      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings 0
      - name: Build
        run: npm run build