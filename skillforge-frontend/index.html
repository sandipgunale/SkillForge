<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1320" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbf8" media="(prefers-color-scheme: light)" />
    <meta

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SkillForge" />
    <meta property="og:title" content="SkillForge — Your focus is forged" />
    <meta
      property="og:description"
      content="AI-powered learning that cuts through the noise: adaptive practice, quizzes, roadmaps and analytics in one calm workspace."
    />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SkillForge — Your focus is forged" />
    <meta
      name="twitter:description"
      content="AI-powered learning that cuts through the noise: adaptive practice, quizzes, roadmaps and analytics in one calm workspace."
    />
    <title>SkillForge — Your focus is forged</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Theme pre-hydration — next-themes (Vite/React, non-Next) does not
         inject its bootstrap script, so without this the first paint can
         render the wrong theme (flash) and the first render is
         nondeterministic. Storage key "theme" + class attribute must match
         the ThemeProvider config (src/providers/ThemeProvider.jsx). */
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme = stored
            ? JSON.parse(stored)
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — fall back to the stylesheet default */
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
