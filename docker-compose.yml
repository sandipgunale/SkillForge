services:
  postgres:
    image: postgres:16-alpine
    container_name: skillforge-postgres
    environment:
      POSTGRES_DB: skillforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - skillforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./skillforge-backend/skillforge-backend
    container_name: skillforge-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/skillforge
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-flash-latest,gemini-2.5-flash,gemini-2.0-flash}
      COOKIE_SECURE: "false"
    ports:
      - "8080:8080"

volumes:
  skillforge_pgdata:
