# ==========================================================
# dev profile (default active profile)
# ==========================================================

# Verbose app logging for local development
logging.level.com.project.skillforgebackend=DEBUG
logging.level.org.springframework.security=INFO

# Cookie security relaxed on localhost (no TLS)
cookie.secure=${COOKIE_SECURE:false}
cookie.same-site=${COOKIE_SAME_SITE:LAX}

# Rate limiting on by default; disable with RATE_LIMIT_ENABLED=false
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# CORS — local development allows the local Vite dev server only.
# Override with FRONTEND_URL or APP_CORS_ALLOWED_ORIGINS for a different local port.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://localhost:5173}}
