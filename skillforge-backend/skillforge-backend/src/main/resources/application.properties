# ==========================================================
# Application
# ==========================================================
spring.application.name=skillforge-backend

# ==========================================================
# Local .env (optional; for running without exporting env vars)
# ==========================================================
spring.config.import=optional:file:./.env[.properties]

# ==========================================================
# Active Profile
# ==========================================================
spring.profiles.active=dev

# ==========================================================
# Database Configuration
# ==========================================================
# Empty defaults are deliberate: ConfigValidationService reports ALL missing
# required variables in one readable startup error instead of Spring failing
# on the first unresolved placeholder.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================================
# JPA / Hibernate
# ==========================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================================
# Flyway
# ==========================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ==========================================================
# Server
# ==========================================================
server.port=8080
# Trust X-Forwarded-For from the fronting proxy so rate limiting and
# audit keys use the real client IP (proxy must overwrite this header)
server.forward-headers-strategy=framework

# ==========================================================
# JWT Configuration
# ==========================================================
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiry=900000
jwt.refresh-token-expiry=604800000
# Shorter lifetime used when "remember me" is not checked
jwt.refresh-token-expiry-short=86400000
jwt.issuer=${JWT_ISSUER:skillforge}
jwt.audience=${JWT_AUDIENCE:skillforge-api}
# Tolerance (seconds) for a verifier clock slightly ahead/behind the issuer
jwt.clock-skew-seconds=30

# ==========================================================
# Cookies
# ==========================================================
cookie.same-site=${COOKIE_SAME_SITE:LAX}
cookie.secure=${COOKIE_SECURE:false}

# ==========================================================
# App (frontend origin used in reset links, reset-token TTL)
# ==========================================================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.password-reset-ttl-minutes=${APP_PASSWORD_RESET_TTL_MINUTES:30}

# ==========================================================
# Security headers (CSP + HSTS). COOP/COEP/CORP and
# X-Permitted-Cross-Domain-Policies are static headers set in SecurityConfig.
# The default CSP keeps Swagger UI working (same-origin scripts styles and
# data: images); tighten in production as needed.
# ==========================================================
app.security-headers.content-security-policy=${CSP_POLICY:default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'}
app.security-headers.hsts-enabled=${HSTS_ENABLED:true}
app.security-headers.hsts-include-sub-domains=true
app.security-headers.hsts-max-age-seconds=31536000

# ==========================================================
# CORS — REQUIRED in deployed environments.
# Comma-separated list of allowed frontend origins. The dev profile
# (application-dev.properties) falls back to FRONTEND_URL/localhost;
# here there is intentionally NO fallback, so a misconfigured prod
# deployment fails startup loudly instead of serving an open CORS policy.
# ==========================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${FRONTEND_URL:}}

# ==========================================================
# Mail (leave spring.mail.host empty in dev — reset links are logged)
# ==========================================================
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}

# ==========================================================
# Gemini AI Configuration
# ==========================================================
gemini.api-key=${GEMINI_API_KEY:}
# Comma-separated models; client rotates to the next one on HTTP 429/5xx,
# since free-tier quotas (20 req/day) are tracked per model. NOTE: only
# real model ids are valid (gemini-flash-latest is NOT a valid model).
gemini.models=${GEMINI_MODELS:gemini-2.5-flash,gemini-2.0-flash,gemini-1.5-flash}
gemini.temperature=0.7
# Cost guardrails: per-user daily question budget and parse retry budget
gemini.max-questions-per-day=${GEMINI_MAX_QUESTIONS_PER_DAY:200}
gemini.max-parse-retries=2
# Transport timeouts (ms) and model-rotation retry pacing
gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gemini.connect-timeout-ms=${GEMINI_CONNECT_TIMEOUT_MS:15000}
gemini.read-timeout-ms=${GEMINI_READ_TIMEOUT_MS:60000}
gemini.retry-delay-max-seconds=${GEMINI_RETRY_DELAY_MAX_SECONDS:45}
gemini.transport-retry-sleep-seconds=${GEMINI_TRANSPORT_RETRY_SLEEP_SECONDS:2}

# ==========================================================
# AI resilience strategy (circuit breaker / retry / time limit)
# ==========================================================
ai.resilience.circuit-breaker-sliding-window-size=10
ai.resilience.circuit-breaker-minimum-calls=5
ai.resilience.circuit-breaker-failure-rate-threshold=50
ai.resilience.circuit-breaker-wait-open-seconds=20
ai.resilience.circuit-breaker-half-open-calls=3
ai.resilience.retry-max-attempts=${AI_RETRY_MAX_ATTEMPTS:3}
ai.resilience.retry-initial-backoff-millis=${AI_RETRY_INITIAL_BACKOFF_MS:500}
ai.resilience.retry-backoff-multiplier=${AI_RETRY_BACKOFF_MULTIPLIER:2.0}
ai.resilience.retry-max-backoff-millis=${AI_RETRY_MAX_BACKOFF_MS:5000}
ai.resilience.time-limiter-seconds=${AI_TIME_LIMITER_SECONDS:100}
ai.resilience.executor-threads=${AI_EXECUTOR_THREADS:4}

# ==========================================================
# AI service behaviour (caching + guardrails + playground)
# ==========================================================
# Cache deterministic learning-path completions by exact request params
ai.service.cache-enabled=${AI_CACHE_ENABLED:true}
# Guardrail: max length of any user-supplied prompt field (topic/goal/title)
ai.service.max-field-length=${AI_MAX_FIELD_LENGTH:300}
# Guardrail: max total prompt size sent to the provider
ai.service.max-prompt-length=${AI_MAX_PROMPT_LENGTH:50000}
# Guardrail: max questions per AI quiz-generation request
ai.service.max-questions-per-request=${AI_MAX_QUESTIONS_PER_REQUEST:50}
# Admin playground: max prompt length accepted from the console
ai.service.max-playground-prompt-length=${AI_MAX_PLAYGROUND_PROMPT_LENGTH:20000}

# ==========================================================
# OpenAI Configuration (Optional — secondary provider)
# ==========================================================
# When set, OpenAI is registered as a secondary AI provider. The
# AiProviderRegistry fails over to it whenever Gemini is rate-limited
# (HTTP 429) or returns a transient 5xx, so generation keeps working
# even when Gemini is overloaded. Left blank, the provider is skipped.
openai.api-key=${OPENAI_API_KEY:}
openai.models=${OPENAI_MODELS:gpt-4o-mini,gpt-4o,gpt-3.5-turbo}
openai.temperature=0.7
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
openai.connect-timeout-ms=${OPENAI_CONNECT_TIMEOUT_MS:15000}
openai.read-timeout-ms=${OPENAI_READ_TIMEOUT_MS:60000}
openai.retry-delay-max-seconds=${OPENAI_RETRY_DELAY_MAX_SECONDS:45}
openai.transport-retry-sleep-seconds=${OPENAI_TRANSPORT_RETRY_SLEEP_SECONDS:2}

# ==========================================================
# Bootstrap admin (seeded at startup when ADMIN_PASSWORD is set)
# ==========================================================
app.admin.email=${ADMIN_EMAIL:admin@skillforge.com}
app.admin.password=${ADMIN_PASSWORD:}

# ==========================================================
# Security / Rate limiting
# ==========================================================
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
security.rate-limit.max-requests=5
security.rate-limit.window-minutes=10
# AI endpoint rate limiting (quiz generation, evaluation, learning paths)
security.rate-limit.ai.enabled=${AI_RATE_LIMIT_ENABLED:true}
security.rate-limit.ai.max-requests=20
security.rate-limit.ai.window-minutes=10

# ==========================================================
# Caching (Caffeine)
# Public catalog lookups (topics/tags/resource listings) plus AI learning
# path completions ("aiLearningPath", only when ai.service.cache-enabled)
# share this Caffeine store. Write operations evict all entries. Bounded
# and short-lived so stale data can never outlive a minute or two.
# ==========================================================
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=10m,recordStats

# ==========================================================
# Actuator (health + metrics)
# ==========================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
# SMTP is optional (dev logs reset links); don't fail health when no host is set
management.health.mail.enabled=false
# Who may scrape /actuator/prometheus (comma-separated IPs/CIDRs).
# Empty means the endpoint is effectively disabled (falls through to the
# authenticated rule). The dev profile allows localhost.
app.monitoring.allowed-ips=${METRICS_ALLOWED_IPS:}

# ==========================================================
# Logging (dev profile overrides to DEBUG)
# ==========================================================
logging.level.com.project.skillforgebackend=INFO
logging.level.org.springframework.security=INFO